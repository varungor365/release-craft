[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-craft"
version = "0.1.0"
description = "Dry-run release notes from git history with conventional-commit grouping."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Varun Ruhella"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
release_craft = "release_craft.cli:main"

[tool.setuptools.packages.find]
include = ["release_craft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
